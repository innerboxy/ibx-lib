# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 26.1 起 Mojang 的映射已去混淆并自带参数名,不再需要 Parchment。
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.109
loader_version_range=[1,)
# 试验假人与 Moonlight:这里填的是 Modrinth 的【版本 ID】而非版本号。
# 26.1.2 起两者的 NeoForge 版与 Fabric 版共用同一个版本号(如 26.1.2-3.0.1),用版本号可能解析到 Fabric 版,
# 版本 ID 才能精确锁定 NeoForge 那份。
# 对应 dummmmmmy-26.1.2-3.0.1-neoforge.jar
dummmmmmy_version=nmUUS6Aa
# 对应 moonlight-26.1.2-4.1.0-neoforge.jar
moonlight_version=G661fRNG

