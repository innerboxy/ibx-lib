modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
# 有图标后:把 icon.png 放进 src/main/resources/ 根目录,再取消下面这行注释
#logoFile="icon.png"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="innerbox"
description='''
TODO: mod description.
'''

# 只注入原版生物 AI（让它们认可模组弓弩），武器物品本身仍不吃 mixin。
[[mixins]]
    config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# MmmMmmMmmMmm(试验假人)非强制依赖:装了就联动,没装本模组照常加载。
[[dependencies."${mod_id}"]]
    modId="dummmmmmy"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
