modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="icon.png" #optional
# 像素画图标，模组列表里按最近邻缩放
logoBlur=false
authors="innerbox"
description='''
TODO: mod description.
'''

# 原版生物 AI 认可模组弓弩并按属性射击，以及接管原版弓弩（开关见 config/${mod_id}-startup.toml）。
# Tt 弓弩的物品类本身不依赖 mixin。
[[mixins]]
    config="${mod_id}.mixins.json"

# 试验假人联动：法术伤害数字的专属颜色。只在装了假人时加载，没装不会因找不到目标类而报错。
[[mixins]]
    config="${mod_id}.dummmmmmy.mixins.json"
    requiredMods=["dummmmmmy"]

[[dependencies."${mod_id}"]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# MmmMmmMmmMmm(试验假人)非强制依赖:装了就联动,没装本模组照常加载。
[[dependencies."${mod_id}"]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="player_animation_library"
    type="required"
    versionRange="[1.2.6,)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="dummmmmmy"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

# Curios(饰品栏)非强制依赖:装了就联动,没装本模组照常加载。
[[dependencies."${mod_id}"]]
    modId="curios"
    type="optional"
    versionRange="[${curios_version},)"
    ordering="AFTER"
    side="BOTH"

# Jade 非强制依赖:装了就首次进世界关掉它的「显示Boss」,提示框里在护甲后面显示魔抗。
[[dependencies."${mod_id}"]]
    modId="jade"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
