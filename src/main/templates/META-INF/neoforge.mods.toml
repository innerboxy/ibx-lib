modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="icon.png" #optional
# 像素画图标，模组列表里按最近邻缩放
logoBlur=false
authors="innerbox"
description='''
TODO: mod description.
'''

# 原版生物 AI 认可模组弓弩并按属性射击，以及接管原版弓弩（开关见 config/${mod_id}-startup.toml）。
# Ibx 弓弩的物品类本身不依赖 mixin。
[[mixins]]
    config="${mod_id}.mixins.json"

# 试验假人联动：法术伤害数字的专属颜色。只在装了假人时加载，没装不会因找不到目标类而报错。
[[mixins]]
    config="${mod_id}.dummmmmmy.mixins.json"
    requiredMods=["dummmmmmy"]

# Curios 联动：饰品栏鞘翅槽里的鞘翅也能滑翔。只在装了 Curios 时加载。
[[mixins]]
    config="${mod_id}.curios.mixins.json"
    requiredMods=["curios"]

[[dependencies."${mod_id}"]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# GeckoLib 非强制依赖:只有 3D 法术弹射物(GeoSpellProjectile 和它的渲染器)、Geo 盔甲(IbxGeoArmorItem 和它的渲染器)用到,
# 给注册这些东西的模组继承(那些模组自己强制要 GeckoLib)。lib 自己不会加载这几个类,没装 GeckoLib 照常加载。
[[dependencies."${mod_id}"]]
    modId="geckolib"
    type="optional"
    versionRange="[${geckolib_version},)"
    ordering="NONE"
    side="BOTH"

# Player Animation Library 非强制依赖:装了就有施法、盾击时的玩家动作,没装本模组照常加载(只是手臂不动)。
[[dependencies."${mod_id}"]]
    modId="player_animation_library"
    type="optional"
    versionRange="[1.2.6,)"
    ordering="NONE"
    side="BOTH"

# MmmMmmMmmMmm(试验假人)非强制依赖:装了就联动,没装本模组照常加载。
[[dependencies."${mod_id}"]]
    modId="dummmmmmy"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

# Curios(饰品栏)非强制依赖:装了就联动,没装本模组照常加载。
[[dependencies."${mod_id}"]]
    modId="curios"
    type="optional"
    versionRange="[${curios_version},)"
    ordering="AFTER"
    side="BOTH"

# Jade 非强制依赖:装了就首次进世界关掉它的「显示Boss」,提示框里在护甲后面显示魔抗。
[[dependencies."${mod_id}"]]
    modId="jade"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

# JEI 非强制依赖:装了就把背包旁的属性面板、创造栏子栏、饰品栏占的地方报给它,让书签栏让开。
[[dependencies."${mod_id}"]]
    modId="jei"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

# InventoryHUD+ 非强制依赖:装了就让当前法术框避开它贴着快捷栏画的盔甲栏 HUD(箭数、背包空格数那几格)。
[[dependencies."${mod_id}"]]
    modId="inventoryhud"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
