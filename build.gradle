// 前置库：法力、远程武器、属性等（原 taverntales-l1b）
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/mod-common.gradle')

dependencies {
    // GeckoLib（强制前置）
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Player Animation Library（可选）：施法、盾击时的玩家动作；没装就不放动作。开发环境照常带上
    implementation "maven.modrinth:player-animation-library:${player_animation_library_version}"
    // Dummmmmmy (optional)
    compileOnly "maven.modrinth:mmmmmmmmmmmm:${dummmmmmy_version}"
    runtimeOnly "maven.modrinth:mmmmmmmmmmmm:${dummmmmmy_version}"
    // Dummmmmmy 的前置
    runtimeOnly "maven.modrinth:moonlight:${moonlight_version}"
    // Curios (optional)：编译用完整 jar（属性面板要认它的饰品栏界面、借它算饰品栏占的区域报给 JEI，这些不在 API 里）
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // Jade（可选）：首次进世界关掉它的「显示Boss」、提示框里显示魔抗；只编译，开发环境运行用 tavern/run/mods 里的同版本 jar
    compileOnly "maven.modrinth:jade:${jade_version}"
    // JEI（可选）：背包旁的属性面板开着时告诉 JEI 让开那块地方（书签栏）；只编译 API，开发环境运行用 tavern 里带的 JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
}
